[package]
name = "postflop-solver"
version = "0.1.0"
authors = ["Wataru Inariba", "Jerzy Slaby"]
edition = "2021"
description = "An open-source postflop solver for Texas hold'em poker"
documentation = "https://b-inary.github.io/postflop_solver/postflop_solver/"
repository = "https://github.com/b-inary/postflop-solver"
license = "AGPL-3.0-or-later"

[dependencies]
bincode = { version = "2.0.0-rc.3", optional = true }
once_cell = "1.18.0"
rayon = { version = "1.8.0", optional = true }
regex = "1.9.6"
tch = { version = "0.22.0", optional = true }
zstd = { version = "0.12.4", optional = true, default-features = false }

[build-dependencies]
cc = "1"

[features]
default = ["bincode", "rayon"]
custom-alloc = []
solver-operation-profile = []
neural = ["dep:tch"]
rayon = ["dep:rayon", "zstd?/zstdmt"]

[[example]]
name = "qj2_3bet_sparse"
required-features = ["neural"]

[[example]]
name = "qj2_3bet_warm_start"
required-features = ["neural"]

[[example]]
name = "complete_policy"
required-features = ["neural"]

[[example]]
name = "speed_case"
required-features = ["neural"]

[[example]]
name = "qj2_3bet_refine"
required-features = ["neural"]

[[example]]
name = "qj2_3bet_twosize_fast"
required-features = ["neural"]

[[example]]
name = "qj2_3bet_twosize_deep"
required-features = ["neural"]
